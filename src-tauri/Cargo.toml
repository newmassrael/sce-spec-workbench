[package]
name = "sce-spec-workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Specification workbench: write a specification, see the model an AI client drew from it, and accept what you checked"

[lib]
name = "sce_spec_workbench"

[[bin]]
name = "sce-spec-workbench"
