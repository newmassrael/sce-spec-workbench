[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = { workspace = true }
sce-spec-workbench-core = { workspace = true }
sce-specs = { workspace = true }

[lints]
workspace = true
