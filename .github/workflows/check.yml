name: Check

# The workbench: its screen (TypeScript), its core, the browser shell and the desktop shell
# (Tauri). `scripts/check.sh` is the whole of what is judged. This file only installs what that
# script needs and calls it, so the lane and a local run cannot differ in what they check.
#
# The same check runs a second time on Windows (`windows`), because the people the workbench is
# for write specifications on it. What is judged is the same: the screen, the core's commands, the
# browser shell and the desktop shell compiled and linted. Nothing here claims a window was opened
# on Windows; that is checked by hand until a lane can.
#
# SCE is a submodule at one revision (`sce`), and the check builds against that revision.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Screen, core, browser shell and desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install the libraries Tauri links on Linux
        # The desktop shell is compiled by clippy even though nothing opens a window here;
        # compiling it needs WebKitGTK's development files.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check
        run: scripts/check.sh

  windows:
    name: The same check on Windows
    runs-on: windows-latest
    # A cold Windows run compiles the Tauri shell's dependency tree with MSVC and installs the
    # screen's packages besides.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check
        run: scripts/check.sh
